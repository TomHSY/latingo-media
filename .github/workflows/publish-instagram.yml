name: Publish Instagram

on:
  schedule:
    # :15 past the hour avoids GitHub peak load at :00; scripts guard on Europe/Paris
    # 09:15 UTC ≈ 11:15 Paris (CEST), 10:15 ≈ 12:15, 12:15 ≈ 14:15, 13:15 ≈ 14:15 CET winter
    - cron: '15 9,10,11,12,13 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (bypasses schedule guard)
        required: true
        type: choice
        options:
          - carousel
          - stories
      event_id:
        description: Optional event UUID — republish one story only (with job=stories)
        required: false
        type: string
      republish:
        description: Re-post the carousel even if one was already published today
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Publish carousel (if scheduled or manual)
        if: github.event_name == 'schedule' || github.event.inputs.job == 'carousel'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          FORCE_PUBLISH: ${{ github.event.inputs.job == 'carousel' && 'carousel' || '' }}
          REPUBLISH: ${{ github.event.inputs.republish == 'true' && 'true' || '' }}
        run: npm run publish:carousel-if-scheduled

      - name: Publish stories (if scheduled or manual)
        if: github.event_name == 'schedule' || github.event.inputs.job == 'stories'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          FORCE_PUBLISH: ${{ github.event.inputs.job == 'stories' && 'stories' || '' }}
          STORY_EVENT_ID: ${{ github.event.inputs.event_id }}
        run: npm run publish:stories-if-scheduled
