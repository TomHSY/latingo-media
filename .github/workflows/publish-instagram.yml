name: Publish Instagram

on:
  repository_dispatch:
    types:
      - instagram-carousel
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (bypasses schedule guard)
        required: true
        type: choice
        options:
          - carousel
          - stories
          - thursday-preview
          - thursday
          - thursday-gallery
      event_id:
        description: Optional event UUID — republish one story only (with job=stories)
        required: false
        type: string
      republish:
        description: Re-post the carousel even if one was already published today
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - name: Verify dispatch secret
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "${{ github.event.client_payload.dispatch_secret }}" != "${{ secrets.DISPATCH_SECRET }}" ]; then
            echo "::error::Invalid or missing dispatch_secret in client_payload"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Publish carousel (manual or Cloudflare cron)
        if: github.event.inputs.job == 'carousel' || github.event.action == 'instagram-carousel'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          FORCE_PUBLISH: ${{ github.event.action == 'instagram-carousel' && 'carousel' || github.event.inputs.job == 'carousel' && 'carousel' || '' }}
          REPUBLISH: ${{ github.event.inputs.republish == 'true' && 'true' || '' }}
        run: npm run publish:carousel-if-scheduled

      - name: Publish stories (manual only — daily cron uses Publish Stories Daily)
        if: github.event.inputs.job == 'stories'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          FORCE_PUBLISH: ${{ github.event.inputs.job == 'stories' && 'stories' || '' }}
          STORY_EVENT_ID: ${{ github.event.inputs.event_id }}
        run: npm run publish:stories-if-scheduled

      - name: Thursday preview (manual only — archived from cron)
        if: github.event.inputs.job == 'thursday-preview'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DRY_RUN: 'true'
          FORCE_PUBLISH: ${{ github.event.inputs.job == 'thursday-preview' && 'thursday-preview' || '' }}
        run: npm run render:thursday-preview-if-scheduled

      - name: Thursday publish (manual only — founder approved)
        if: github.event.inputs.job == 'thursday'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          FORCE_PUBLISH: thursday
        run: npm run publish:thursday-if-scheduled

      - name: Thursday gallery (all variants, dry-run artifact)
        if: github.event.inputs.job == 'thursday-gallery'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DRY_RUN: 'true'
          THURSDAY_LOCAL_ONLY: 'true'
        run: npm run render:thursday-gallery

      - name: Upload Thursday gallery artifact
        if: github.event.inputs.job == 'thursday-gallery'
        uses: actions/upload-artifact@v4
        with:
          name: thursday-gallery-${{ github.run_id }}
          path: output/thursday-gallery/
          retention-days: 14
